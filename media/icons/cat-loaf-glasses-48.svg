<svg xmlns="http://www.w3.org/2000/svg"
  width="48" height="48" viewBox="0 0 48 48"
  fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round"
  role="img" aria-label="白いメガネで香箱座りし、尻尾をゆっくり上下させる猫"
  class="cat-loaf-glasses-48">
  <style>
    .cat-loaf-glasses-48 .clg48-tail {
      transform-box: view-box;
      transform-origin: 35.5px 34px;
      animation: clg48-tail-sway 2.8s ease-in-out infinite;
    }
    @keyframes clg48-tail-sway {
      0%, 16%, 100% { transform: rotate(0deg); }
      46%, 56% { transform: rotate(-62deg); }
      86% { transform: rotate(0deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cat-loaf-glasses-48 .clg48-tail { animation: none; }
    }
  </style>
  <!-- 尻尾だけを動かす。付け根は固定し、床に触れた姿勢で少し休む。 -->
  <g class="clg48-tail">
    <path d="M35.5 34C39 34.5 42 37.3 45 37.3" stroke-width="2.4" />
  </g>

  <!-- 胴体は低く丸い香箱形。脚を外に出さない。 -->
  <path d="M26 22c6-1 10 4 10 10v1.5c0 3-2 4-5 4H14c-4 0-6-2-6-5" />
  <path d="M27 31q-3 1-3 4" />

  <!-- 三角の耳と、丸い頬。 -->
  <path d="M5.5 23V12q0-1.5 1.2-.6L12 16q4-1.5 7.5 0l5.3-4.6q1.2-.9 1.2.6v11c0 6.4-3.7 10-10.2 10S5.5 29.4 5.5 23Z" />

  <!-- メガネのレンズだけ白く塗る。背景と猫の胴体は透過。 -->
  <g fill="#fff" stroke-width="1.8">
    <rect x="6.5" y="20" width="8" height="5.8" rx="1.8" />
    <rect x="17.5" y="20" width="8" height="5.8" rx="1.8" />
  </g>
  <path d="M14.5 22h3" stroke-width="1.8" />

  <!-- 口元は小さな1本に省略。 -->
  <path d="m14.2 28.7 1.5 1.2 1.5-1.2" stroke-width="1.5" />
  <path d="M3 27h3m19 0h3" stroke-width="1.5" />
</svg>
