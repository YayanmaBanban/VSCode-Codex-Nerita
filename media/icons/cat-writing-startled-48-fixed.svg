<svg xmlns="http://www.w3.org/2000/svg"
  width="48" height="48" viewBox="0 0 48 48"
  fill="none" stroke="currentColor" stroke-width="2"
  stroke-linecap="round" stroke-linejoin="round"
  role="img" aria-label="書いている途中で正面を向いて驚き、ペンを落とす白いメガネの猫"
  class="cat-startled-fixed-48">
  <!-- 48px用の元パスを維持。全パーツを1本の5.6秒タイムラインに同期。 -->
  <style>
    .cat-startled-fixed-48 .csf48-motion {
      animation-duration: var(--csf48-cycle, 5.6s);
      animation-iteration-count: infinite;
      animation-timing-function: linear;
      transform-box: view-box;
    }
    .cat-startled-fixed-48 .csf48-head {
      transform-origin: 24px 23px;
      animation-name: csf48-head;
      animation-timing-function: ease-in-out;
    }
    .cat-startled-fixed-48 .csf48-look { animation-name: csf48-look; }
    .cat-startled-fixed-48 .csf48-travel { animation-name: csf48-travel; }
    .cat-startled-fixed-48 .csf48-wrist {
      transform-origin: 18px 33px;
      animation-name: csf48-wrist;
      animation-timing-function: ease-in-out;
    }
    .cat-startled-fixed-48 .csf48-recoil {
      animation-name: csf48-recoil;
      animation-timing-function: ease-in-out;
    }
    .cat-startled-fixed-48 .csf48-held-pen { animation-name: csf48-held; }
    .cat-startled-fixed-48 .csf48-drop-visible {
      opacity: 0;
      animation-name: csf48-drop-visible;
    }
    .cat-startled-fixed-48 .csf48-drop {
      transform-origin: 17px 27.7px;
      animation-name: csf48-drop;
    }
    .cat-startled-fixed-48 .csf48-mouth-normal { animation-name: csf48-mouth-normal; }
    .cat-startled-fixed-48 .csf48-mouth-surprised {
      opacity: 0;
      animation-name: csf48-mouth-surprised;
    }
    .cat-startled-fixed-48 .csf48-alert {
      opacity: 0;
      transform-origin: 40px 14px;
      animation-name: csf48-alert;
    }
    .cat-startled-fixed-48 .csf48-ink {
      stroke-dasharray: 1;
      animation-name: csf48-ink;
    }
    @keyframes csf48-head {
      0%, 6%, 38%, 100% { transform: translate(-.25px, .7px) rotate(-5deg); }
      20% { transform: translate(-.25px, .7px) rotate(-3deg); }
      42% { transform: translate(0, .5px) rotate(-4deg); }
      48% { transform: translate(0, -.6px) rotate(0deg); }
      53%, 88% { transform: translate(0, 0) rotate(0deg); }
    }
    @keyframes csf48-look {
      0%, 42%, 100% { transform: translate(-.35px, .6px); }
      48%, 88% { transform: translate(0, 0); }
    }
    @keyframes csf48-travel {
      0%, 6%, 98%, 100% { transform: translate(0, 0); }
      38%, 90% { transform: translate(4px, 0); }
    }
    @keyframes csf48-wrist {
      0%, 6%, 12%, 18%, 24%, 30%, 36%, 100% { transform: rotate(-2deg); }
      3%, 9%, 15%, 21%, 27%, 33%, 39% { transform: rotate(2deg); }
      42%, 96% { transform: rotate(0deg); }
    }
    @keyframes csf48-recoil {
      0%, 47%, 98%, 100% { transform: translate(0, 0); }
      52%, 88% { transform: translate(-2.5px, -1.5px); }
    }
    @keyframes csf48-held {
      0%, 47.999%, 98%, 100% { opacity: 1; }
      48%, 94% { opacity: 0; }
    }
    @keyframes csf48-drop-visible {
      0%, 47.999%, 94%, 100% { opacity: 0; }
      48%, 88% { opacity: 1; }
    }
    @keyframes csf48-drop {
      0%, 48% { transform: translate(0, 0) rotate(0deg); }
      51% { transform: translate(-.3px, .65px) rotate(-6deg); }
      56% { transform: translate(-2.5px, 3.4px) rotate(-22deg); }
      62% { transform: translate(-4.8px, 10.2px) rotate(-46.668337deg); }
      66% { transform: translate(-5px, 8.6px) rotate(-51deg); }
      71%, 100% { transform: translate(-5.2px, 10.2px) rotate(-46.668337deg); }
    }
    @keyframes csf48-mouth-normal {
      0%, 45.999%, 94%, 100% { opacity: 1; }
      46%, 90% { opacity: 0; }
    }
    @keyframes csf48-mouth-surprised {
      0%, 45.999%, 94%, 100% { opacity: 0; }
      46%, 90% { opacity: 1; }
    }
    @keyframes csf48-alert {
      0%, 44%, 76%, 100% { opacity: 0; transform: scale(.8); }
      48% { opacity: 1; transform: scale(1.15); }
      53%, 66% { opacity: 1; transform: scale(1); }
    }
    @keyframes csf48-ink {
      0%, 6%, 98%, 100% { stroke-dashoffset: 1; opacity: 1; }
      38%, 88% { stroke-dashoffset: 0; opacity: 1; }
      94% { stroke-dashoffset: 0; opacity: 0; }
      94.001%, 97% { stroke-dashoffset: 1; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cat-startled-fixed-48 .csf48-motion { animation: none; }
    }
  </style>
  <defs>
    <!-- 前足の後ろにあるペンだけを抜く。白い背景の塗りつぶしではない。 -->
    <mask id="csf48-v2-paw-mask" maskUnits="userSpaceOnUse"
      maskContentUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"
      style="mask-type:luminance">
      <rect width="48" height="48" fill="white" stroke="none" />
      <g class="csf48-motion csf48-travel">
      <g class="csf48-motion csf48-wrist">
        <g class="csf48-motion csf48-recoil"><path d="M12 26c-4-1-6 4-2 6s8 0 7-3c-.5-1.5-2.5-2.5-5-3Z" fill="black" stroke="black" stroke-width="3.6" /></g>
      </g>
    </g>
    </mask>
    <!-- 落ちるペンと紙の線が交差しても、背面の紙が透けない。 -->
    <mask id="csf48-v2-paper-mask" maskUnits="userSpaceOnUse"
      maskContentUnits="userSpaceOnUse" x="0" y="0" width="48" height="48"
      style="mask-type:luminance">
      <rect width="48" height="48" fill="white" stroke="none" />
      <g class="csf48-motion csf48-drop-visible">
        <path class="csf48-motion csf48-drop" d="M12 22.4 22 33"
          fill="none" stroke="black" stroke-width="4" />
      </g>
    </mask>
  </defs>

  <!-- 頭は1つだけ。輪郭は変形せず、傾きと顔の向きで前を見る。 -->
  <g class="csf48-motion csf48-head">
    <g transform="translate(8 -9)">
      <path d="M5.5 23V12q0-1.5 1.2-.6L12 16q4-1.5 7.5 0l5.3-4.6q1.2-.9 1.2.6v11c0 6.4-3.7 10-10.2 10S5.5 29.4 5.5 23Z" />
      <g class="csf48-motion csf48-look">
        <g fill="#fff" stroke-width="1.8">
        <rect x="6.5" y="20" width="8" height="5.8" rx="1.8"/>
        <rect x="17.5" y="20" width="8" height="5.8" rx="1.8"/>
      </g>
        <path d="M14.5 22h3" stroke-width="1.8" />
        <path class="csf48-motion csf48-mouth-normal" d="m14.2 28.7 1.5 1.2 1.5-1.2" stroke-width="1.5" />
        <ellipse class="csf48-motion csf48-mouth-surprised"
          cx="15.7" cy="29" rx="1.1" ry="1.4" stroke-width="1.5" />
        <path d="M3 27h3m19 0h3" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- 机に添えた前足・用紙は元のパスのまま。 -->
  <path d="M32 21.5l2 4.5c2.5 1 4.5 3 4.5 5 0 1.3-1.2 2-3 2h-4.8c-1.5 0-2.3-1-1.8-2.2.4-1.3 1.8-2.1 3.6-2.1" />
  <g mask="url(#csf48-v2-paper-mask)">
    <path d="M17 36h12" stroke-width="1.6" />
    <path class="csf48-motion csf48-ink" d="M18 33h4" pathLength="1" stroke-width="1.5" />
  </g>

  <!-- 放す瞬間までの前足とペン。 -->
  <g class="csf48-motion csf48-travel">
      <g class="csf48-motion csf48-wrist">
        <g class="csf48-motion csf48-recoil"><path class="csf48-motion csf48-held-pen" d="m8 22.4 3 2.9m5.5 6.1L18 33" />
          <path d="M12 26c-4-1-6 4-2 6s8 0 7-3c-.5-1.5-2.5-2.5-5-3Z" /></g>
      </g>
    </g>

  <!-- 同じ座標から離れ、天板で小さく跳ねるペン。 -->
  <g mask="url(#csf48-v2-paw-mask)">
    <g class="csf48-motion csf48-drop-visible">
      <path class="csf48-motion csf48-drop" d="M12 22.4 22 33" />
    </g>
  </g>

  <!-- 小さい表示でも読み取れる「ハッ」の記号。 -->
  <g class="csf48-motion csf48-alert">
    <path d="M40 8.5v4.5" />
    <circle cx="40" cy="16.5" r="1" fill="currentColor" stroke="none" />
  </g>

  <path d="M4 40h40M8 40v5m32-5v5" />
</svg>
