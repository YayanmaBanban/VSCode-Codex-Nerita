      <path d="M9.49 12.68C15.31 10.6 26.06 11.09 31.44 14.14"/>
      <path d="M8.63 17.28C14.27 15.35 26.62 15.96 31.62 18.78"/>
      <path d="M9.49 21.28C14.26 19.86 25.65 20.45 30.29 22.48"/>
