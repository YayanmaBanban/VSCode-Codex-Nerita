        C27.94 25.74 28.36 25.25 28.73 24.88
        C29.41 24.19 30.14 23.19 30.29 22.48
        C31.17 21.48 31.78 19.7 31.62 18.78
        C32.08 17.76 32.02 15.13 31.44 14.14
        C31.6 13.16 30.74 10.69 29.65 9.98
        C28.18 7.27 24.05 6.09 19.9 5.92Z"/>
