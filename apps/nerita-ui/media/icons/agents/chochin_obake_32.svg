      C23.34 1.1 24.94 1.41 25.54 2.22
      C26.1 2.96 26.1 4.1 25.96 5.3
      L24.55 4.81
      C24.69 3.68 24.55 3.2 23.94 2.91
      C23.13 2.53 21.75 2.44 20.95 2.6
      C20.21 2.74 20.01 3.2 19.89 4.15Z"/>
    <path d="
