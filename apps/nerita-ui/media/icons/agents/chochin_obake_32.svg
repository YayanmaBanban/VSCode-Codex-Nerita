<svg xmlns="http://www.w3.org/2000/svg"
  width="32" height="32" viewBox="0 0 32 32"
  overflow="hidden" role="img" aria-label="チョウチンオバケ">
  <defs>
    <linearGradient id="chochin32-paper"
      x1="11" y1="8" x2="30" y2="25"
      gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8849"/>
      <stop offset=".55" stop-color="#FF6D34"/>
